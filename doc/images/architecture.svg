<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="architecture-title">
  <title id="architecture-title">Driving adapters call the use cases of this library. Use cases work with the domain and the ports. Driven adapters outside the library implement the ports.</title>
  <defs>
    <marker id="architecture-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="architecture-ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-s" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="architecture-ahf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-f" d="M0,0 L10,5 L0,10 z"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <style>
      svg { font-family: Inter, Roboto, 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif; }
      text { fill: #212121; font-size: 13px; }
      .bg { fill: #ffffff; }
      .t { font-size: 15px; font-weight: 700; }
      .n { font-weight: 700; }
      .sub { fill: #757575; font-size: 12px; }
      .label { fill: #757575; font-size: 11.5px; font-weight: 600; }
      .eyebrow { fill: #757575; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .code { font-family: 'JetBrains Mono', 'Roboto Mono', 'DejaVu Sans Mono', monospace; font-size: 12px; }
      .big { font-size: 16px; font-weight: 700; }
      .on { fill: #1d1d1b; }
      .fgtext { fill: #6f4bb8; }
      .card { fill: #ffffff; stroke: #bdbdbd; stroke-width: 1.25; filter: url(#sh); }
      .ac { fill: #fef4d6; stroke: #fbba00; stroke-width: 2; filter: url(#sh); }
      .sk { fill: #fcf5e3; stroke: #e0a500; stroke-width: 1.5; filter: url(#sh); }
      .pm { fill: #e6f4f2; stroke: #1f9d8b; stroke-width: 1.5; filter: url(#sh); }
      .kp { fill: #eaf1fb; stroke: #3f7fd9; stroke-width: 1.5; filter: url(#sh); }
      .fw { fill: #efefef; stroke: #6b6b69; stroke-width: 1.5; filter: url(#sh); }
      .fg { fill: #f2eefa; stroke: #8a63d2; stroke-width: 1.5; filter: url(#sh); }
      .err { fill: #fbebeb; stroke: #d64545; stroke-width: 1.5; filter: url(#sh); }
      .thick { stroke-width: 2.25; }
      .solid-ac { fill: #fbba00; }
      .solid-sk { fill: #e0a500; }
      .solid-pm { fill: #1f9d8b; }
      .solid-kp { fill: #3f7fd9; }
      .solid-fw { fill: #6b6b69; }
      .solid-fg { fill: #8a63d2; }
      .soft { fill: #f5f5f5; }
      .ghost { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .frame { fill: none; stroke: #bdbdbd; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .edge { fill: none; stroke: #757575; stroke-width: 1.75; }
      .strong { stroke: #fbba00; stroke-width: 2.75; }
      .dashed { stroke-dasharray: 6 4; }
      .edge-fg { fill: none; stroke: #8a63d2; stroke-width: 1.75; stroke-dasharray: 6 4; }
      .head { fill: #757575; }
      .head-s { fill: #fbba00; }
      .head-f { fill: #8a63d2; }
      .icon { fill: none; stroke: #212121; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
      .life { stroke: #bdbdbd; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .rule { stroke: #e0e0e0; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="960" height="300" rx="16"/>
  <rect class="card" x="20" y="64" width="200" height="70" rx="12"/>
  <text class="eyebrow" x="36" y="86">ADAPTER · OUTSIDE</text>
  <text class="t" x="36" y="106">REST, CMS, jobs</text>
  <text class="sub" x="36" y="124">call the use cases</text>

  <rect class="ac" x="260" y="20" width="440" height="262" rx="14" style="fill:#fffaeb"/>
  <text class="eyebrow" x="280" y="44">EVERY MODULE OF THIS LIBRARY</text>
  <rect class="card" x="280" y="64" width="180" height="70" rx="12"/>
  <text class="eyebrow" x="296" y="86">USECASE</text>
  <text class="t" x="296" y="106">Use cases</text>
  <text class="code sub" x="296" y="124">EnqueuePublishTasks…</text>
  <rect class="sk" x="500" y="64" width="180" height="70" rx="12"/>
  <text class="eyebrow" x="516" y="86">DOMAIN</text>
  <text class="t" x="516" y="106">Entities, values</text>
  <text class="code sub" x="516" y="124">PublishSchedule…</text>
  <rect class="pm" x="280" y="182" width="400" height="80" rx="12"/>
  <text class="eyebrow" x="296" y="204">PORT</text>
  <text class="t" x="296" y="224">Interfaces only</text>
  <text class="code sub" x="296" y="244">PublishedFileRepository · PublishTaskExecutor…</text>
  <path class="edge strong" d="M220,99 H276" marker-end="url(#architecture-ahs)"/>
  <path class="edge" d="M460,99 H496" marker-end="url(#architecture-ah)"/>
  <path class="edge" d="M370,134 V178" marker-end="url(#architecture-ah)"/>
  <text class="label" x="380" y="160">uses</text>
  <text class="sub" x="590" y="160" text-anchor="middle">depends on the JDK only</text>

  <rect class="card" x="740" y="182" width="200" height="80" rx="12"/>
  <text class="eyebrow" x="756" y="204">ADAPTER · OUTSIDE</text>
  <text class="t" x="756" y="224">Database, files,</text>
  <text class="t" x="756" y="242">thread pools</text>
  <path class="edge dashed" d="M740,222 H686" marker-end="url(#architecture-ah)"/>
  <text class="sub" x="756" y="172">implement the ports</text>
</svg>
